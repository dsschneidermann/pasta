{% extends "_base.html" %}

{% block head %}
{{ super() }}
<style>
    #layout { display: flex; align-items: flex-start; }
    #sidebar { flex: 0 0 16rem; padding-right: 1rem; font-size: 0.9rem; }
    #sidebar ul { list-style: disc; padding-left: 0.9rem; margin: 0.3rem 0; }
    #sidebar li::marker { font-size: 0.7em; }
    #main { flex: 1 1 auto; padding-left: 1.5rem; border-left: 1px solid #8886;
        min-width: 0; min-height: 1000px; }

    /* Page | Model view toggle (see _view_toggle.js). Model overlays the page-type doc. */
    #view-toggle { margin: 0 0 0.5rem; display: inline-flex; float: right; }
    #view-toggle button { font-size: 0.85rem; padding: 0.25rem 0.9rem; margin: 0;
        cursor: pointer; background: none; border: 1px solid #8886; }
    #view-toggle button:first-child { border-radius: 4px 0 0 4px; }
    #view-toggle button:last-child { border-radius: 0 4px 4px 0; border-left: 0; }
    #view-toggle button[aria-pressed="true"] { background: #8883; font-weight: 600; }
    #view-body { position: relative; clear: both; }
    #view-body.model-active { min-height: calc(100vh - 12rem); }
    #view-body.model-active #page-view { margin-top: 2.5rem; padding-top: 90vh; }
    #model-view { position: absolute; inset: 0; width: 100%; height: 90vh;
        border: 0; background: #fff; }
</style>
{% endblock %}

{% block bodyclass %}page{% endblock %}

{% block content %}
<div id="layout">
    <nav id="sidebar">
        <a href="/{{ workspace_id }}"><strong>Workspace</strong></a>
        {% if show_archived %}
        <a style="float:right" href="{{ request.url.path }}">Hide archived</a>
        {% else %}
        <a style="float:right" href="{{ request.url.path }}?archived=true">Show archived</a>
        {% endif %}
        {{ nav | safe }}
    </nav>
    <main id="main">
        <div id="view-toggle" role="group" aria-label="View">
            <button type="button" id="show-page" aria-pressed="true">Page</button>
            <button type="button" id="show-model" aria-pressed="false">Model</button>
        </div>
        <div id="view-body">
            <div id="page-view">
                {% block main %}{% endblock %}
            </div>
            <iframe id="model-view" title="Page-type model"
                    data-src="/sphinx/page-types/{{ page_type_doc }}.html" hidden></iframe>
        </div>
    </main>
</div>
<script>
{% include '_view_toggle.js' %}
</script>
{% endblock %}
